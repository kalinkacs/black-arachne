<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Arachne</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">◆</span><h1>Black Arachne</h1></div>
    <p>Расследование Linux-инцидентов</p>
    <p id="collector-status" aria-live="polite"></p>
  </header>
  <nav class="workspace-nav" aria-label="Разделы">
    <button id="cases-tab" type="button" aria-pressed="true" aria-controls="cases-view">Расследования</button>
    <button id="integrity-tab" type="button" aria-pressed="false" aria-controls="integrity-view">Целостность файлов</button>
    <button id="decoys-tab" type="button" aria-pressed="false" aria-controls="decoys-view">Мёртвые души</button>
  </nav>
  <main>
    <div id="cases-view" class="cases-grid">
    <aside aria-label="Список расследований">
      <div class="section-head"><h2>Расследования</h2><button id="reload" type="button">Обновить</button></div>
      <label class="filter" for="filter">Фильтр по хосту или эпизоду<input id="filter" type="search" placeholder="Имя хоста или эпизода"></label>
      <p id="status" role="status"></p>
      <ul id="runs"></ul>
    </aside>
    <article id="case" aria-label="Досье расследования" aria-live="polite">
      <h2>Досье расследования</h2>
      <p>Выбери расследование из списка.</p>
    </article>
    </div>
    <section id="integrity-view" class="integrity-view" aria-label="Целостность файлов" hidden>
      <div class="section-head"><h2>Целостность файлов</h2><button id="integrity-reload" type="button">Обновить</button></div>
      <div id="integrity-content" aria-live="polite"></div>
    </section>
    <section id="decoys-view" class="integrity-view" aria-label="Мёртвые души" hidden>
      <div class="section-head"><h2>Мёртвые души</h2><button id="decoys-reload" type="button">Обновить</button></div>
      <div id="decoys-content" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
